# Configuration for YouTube Video Scraper

# Directory paths
data_dir: "./data"
db_path: "manifest.db"
log_dir: "./logs"

# Performance & Rate Limiting
workers: 2
rate_limit_delay: 2.5  # Seconds of delay/jitter between requests
retry_count: 3

# Download & Cookies Settings
download_video: true
audio_only: false
quality_ceiling: "480p"   # e.g., 144p, 360p, 480p, 720p, 1080p, 4k, best, worst
download_thumbnail: true
cookies_dir: "D:/fai/cookies" # Path to cookies directory containing jaman.txt, magan.txt
cookies_file: null         # Specific cookies file override if needed

# Audio Extraction
extract_audio: true        # Extract high-quality audio track in a separate audio folder
audio_format: "mp3"        # Target audio format (mp3, m4a, wav, flac)

# Frame Extraction (FFmpeg)
extract_frames: true       # Set to true to extract image frames from downloaded videos
frame_skip: 50             # Extract 1 frame every N frames (e.g., 1 = all frames, 10 = 1 frame per 10 frames)

# Content Extraction
max_comments: null         # null = no cap (extract all comments)
subtitle_languages:
  - "en"
  - "auto"
prefer_manual_subtitles: true

# Logging
log_level: "INFO"
